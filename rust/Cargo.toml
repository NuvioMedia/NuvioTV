[workspace]
resolver = "2"
members = ["nuvio-core", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
uniffi = "0.29"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "macros"] }
