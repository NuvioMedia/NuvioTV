SUPABASE_URL=https://YOUR_PROJECT.supabase.co
SUPABASE_ANON_KEY=your-anon-key-here
AVATAR_PUBLIC_BASE_URL=https://YOUR_PROJECT.supabase.co/storage/v1/object/public/avatars
TV_LOGIN_WEB_BASE_URL=https://app.omnio.tv/tv-login
TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
AIOMETADATA_BASE_URL=https://nuviotv-aiometadata.fly.dev/

# ── :app-tv release signing (env vars take precedence over these) ─────────────
# OMNIO_RELEASE_STORE_FILE=/abs/path/to/omniotv.jks
# OMNIO_RELEASE_KEY_ALIAS=omniotv
# OMNIO_RELEASE_KEY_PASSWORD=...
# OMNIO_RELEASE_STORE_PASSWORD=...

# ── :app-phone release signing (env vars take precedence over these) ──────────
# Default storeFile resolves to ../omnio-phone.jks (repo root) if unset.
# OMNIO_PHONE_RELEASE_STORE_FILE=/abs/path/to/omnio-phone.jks
# OMNIO_PHONE_RELEASE_KEY_ALIAS=omniophone
# OMNIO_PHONE_RELEASE_KEY_PASSWORD=...
# OMNIO_PHONE_RELEASE_STORE_PASSWORD=...

# ── :app-phone Gradle Play Publisher service account ──────────────────────────
# Generate a service account JSON in Google Cloud / Play Console with the
# "Service Account User" + "Release manager" roles, download the JSON, and
# point this at it. Defaults to <repo>/play-service-account-phone.json.
# OMNIO_PHONE_PLAY_SERVICE_ACCOUNT_JSON=/abs/path/to/play-service-account-phone.json
