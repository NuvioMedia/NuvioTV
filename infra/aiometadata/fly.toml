# fly.toml app configuration file generated for nuviotv-aiometadata on 2026-04-21T22:58:35+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nuviotv-aiometadata'
primary_region = 'iad'

[build]
  image = "ghcr.io/cedya77/aiometadata:v.testing.20260422.2-e66078a9d02186ab182f8f6826bd455a2cf3874d"

[env]
  LOG_LEVEL = 'info'
  NODE_ENV = 'production'
  PORT = '3232'

[[mounts]]
  source = 'aiometadata_data'
  destination = '/data'

[http_service]
  internal_port = 3232
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
