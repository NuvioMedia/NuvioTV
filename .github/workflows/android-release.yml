name: Build Android TV Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview metadata, create a draft, or publish the release
        required: true
        type: choice
        options:
          - dry-run
          - draft
          - publish
        default: dry-run
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.mode }} Android TV release
    runs-on: ubuntu-latest
    env:
      # The default github.token (governed by repo Settings > Actions > General >
      # Workflow permissions) kept returning "HTTP 403: Resource not accessible by
      # integration" on `gh release create` even after switching that setting to
      # read-and-write - falls back to it if RELEASE_PAT isn't set, but a PAT with
      # Contents: Read and write scoped to this repo sidesteps that ambiguity entirely.
      GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tooling
        run: |
          for script in scripts/generate-release-notes.sh scripts/release-metadata.sh scripts/run-release-check.sh scripts/verify-release-apks.sh; do
            bash -n "$script"
          done
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v

      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

          unexpected_changes="$(
            git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
              | grep -Ev '^(\.github/workflows/(android-release|beta-release)\.yml|scripts/release-metadata\.sh|scripts/generate-release-notes\.sh|scripts/generate_release_notes\.py|scripts/release_notes/.*|scripts/tests/.*|scripts/verify-release-apks\.sh)$' \
              || true
          )"
          if [[ -n "${unexpected_changes}" ]]; then
            echo "The version bump must be the final application change before release." >&2
            echo "Unexpected files changed after the bump:" >&2
            echo "${unexpected_changes}" >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" != "dry-run" ]]; then
            required_secrets=(
              LOCAL_PROPERTIES_BASE64
              RELEASE_KEYSTORE_BASE64
              RELEASE_KEY_ALIAS
              RELEASE_KEY_PASSWORD
              RELEASE_STORE_PASSWORD
            )
            missing=()
            for secret_name in "${required_secrets[@]}"; do
              if [[ -z "${!secret_name}" ]]; then
                missing+=("${secret_name}")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
              exit 1
            fi
          fi

      - name: Generate release notes
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          release_note_args=(
            --from "${PREVIOUS_BUMP}"
            --to "${CURRENT_BUMP}"
            --repository "${GITHUB_REPOSITORY}"
            --exclude "${EXCLUDE_COMMITS}"
            --quality-report release-note-quality.md
          )
          if [[ "${RELEASE_MODE}" == "publish" ]]; then
            release_note_args+=(--strict)
          fi

          generation_status=0
          ./scripts/generate-release-notes.sh "${release_note_args[@]}" \
            > release-notes.md || generation_status=$?

          if [[ ! -s release-notes.md ]]; then
            echo "No release-note commits were found." >&2
            exit 1
          fi

          {
            echo "## ${{ steps.release.outputs.title }}"
            echo
            cat release-notes.md
            echo
            cat release-note-quality.md
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${generation_status}"

      - name: Upload release-note review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nuviotv-${{ steps.release.outputs.version }}-${{ inputs.mode }}-release-notes
          path: |
            release-notes.md
            release-note-quality.md
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Java
        if: inputs.mode != 'dry-run'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: inputs.mode != 'dry-run'
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release properties
        if: inputs.mode != 'dry-run'
        run: |
          keystore_path="${RUNNER_TEMP}/nuviotv-release.jks"
          # Strip whitespace/newlines that copy-pasting a secret's value into the
          # GitHub UI can pick up (e.g. a trailing newline from a source .txt file) -
          # a stray character there makes the keystore password mismatch with a
          # BadPaddingException rather than a clear "wrong password" message.
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${keystore_path}"
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

          if [[ -n "${LOCAL_DEV_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_DEV_PROPERTIES_BASE64}" | base64 --decode > local.dev.properties
          fi

          set_property() {
            local property_name="$1"
            local property_value
            property_value="$(printf '%s' "$2" | tr -d '\r\n')"
            [[ -n "${property_value}" ]] || return 0
            sed -i -E "/^[[:space:]]*${property_name}[[:space:]]*=/d" local.properties
            printf '\n%s=%s\n' "${property_name}" "${property_value}" >> local.properties
          }

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          set_property NUVIO_RELEASE_STORE_FILE "${keystore_path}"
          set_property NUVIO_RELEASE_KEY_ALIAS "${RELEASE_KEY_ALIAS}"
          set_property NUVIO_RELEASE_KEY_PASSWORD "${RELEASE_KEY_PASSWORD}"
          set_property NUVIO_RELEASE_STORE_PASSWORD "${RELEASE_STORE_PASSWORD}"

      - name: Verify release signing identity before compilation
        if: inputs.mode != 'dry-run'
        run: |
          expected_certificate="$(tr -d '[:space:]' < scripts/release-signing-cert.sha256)"
          [[ "$expected_certificate" =~ ^[0-9a-f]{64}$ ]] || exit 1
          certificate_file="${RUNNER_TEMP}/release-certificate.der"
          export RELEASE_STORE_PASSWORD="$(printf '%s' "$RELEASE_STORE_PASSWORD" | tr -d '\r\n')"
          release_alias="$(printf '%s' "$RELEASE_KEY_ALIAS" | tr -d '\r\n')"
          # Export only the public certificate. Passwords remain environment inputs.
          keytool -exportcert -keystore "${RUNNER_TEMP}/nuviotv-release.jks" \
            -storepass:env RELEASE_STORE_PASSWORD -alias "$release_alias" \
            -file "$certificate_file" >/dev/null 2>&1 || {
              echo 'Cannot unlock the configured release signing certificate.' >&2
              exit 1
            }
          actual_certificate="$(sha256sum "$certificate_file" | cut -d' ' -f1)"
          [[ "$actual_certificate" == "$expected_certificate" ]] || {
            echo 'Signing certificate differs from the trusted published fork release.' >&2
            echo "  expected: ${expected_certificate}" >&2
            echo "  actual:   ${actual_certificate}" >&2
            exit 1
          }
          echo "Release signing identity verified against the pinned public certificate (${actual_certificate})."

      - name: Run all full-debug JVM tests
        if: inputs.mode != 'dry-run'
        run: bash scripts/run-release-check.sh :app:testFullDebugUnitTest

      - name: Run all full-release JVM tests
        if: inputs.mode != 'dry-run'
        run: bash scripts/run-release-check.sh :app:testFullReleaseUnitTest

      - name: Assemble optimized full-release APKs separately
        if: inputs.mode != 'dry-run'
        run: bash scripts/run-release-check.sh :app:assembleFullRelease

      - name: Verify packaged release identity and native libraries
        if: inputs.mode != 'dry-run'
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          bash scripts/verify-release-apks.sh "$EXPECTED_VERSION" "$EXPECTED_CODE"
          python3 scripts/audit_native_libraries.py --require-16k --verify-runtime app/build/outputs/apk/full/release/*.apk > native-library-audit.json

      - name: Upload verification reports
        if: always() && inputs.mode != 'dry-run'
        uses: actions/upload-artifact@v6
        with:
          name: nuviotv-${{ steps.release.outputs.version }}-verification
          path: |
            app/build/reports/tests/
            app/build/test-results/
            native-library-audit.json
          if-no-files-found: warn
      - name: Upload build artifacts
        if: inputs.mode != 'dry-run'
        uses: actions/upload-artifact@v6
        with:
          name: nuviotv-${{ steps.release.outputs.version }}-full-release
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: inputs.mode != 'dry-run'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_TARGET: ${{ steps.release.outputs.current_bump }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          mapfile -t release_apks < <(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#release_apks[@]} == 0 )); then
            echo "No release APKs were produced." >&2
            exit 1
          fi

          release_args=(
            "${RELEASE_TAG}"
            --target "${RELEASE_TARGET}"
            --title "${RELEASE_TITLE}"
            --notes-file release-notes.md
          )
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          elif [[ "${RELEASE_MODE}" == "publish" ]]; then
            release_args+=(--latest)
          fi
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          gh release create "${release_args[@]}" "${release_apks[@]}"
