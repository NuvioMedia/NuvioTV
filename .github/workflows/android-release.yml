name: Build Android TV Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview metadata or create a draft/published release with Android APKs and Windows PC MSI
        required: true
        type: choice
        options:
          - dry-run
          - draft
          - publish
        default: dry-run
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string
      desktop_version:
        description: Published Windows Desktop MSI version to pair with the APKs
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: android-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.mode }} Android TV release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tooling
        run: |
          bash -n scripts/generate-release-notes.sh scripts/release-metadata.sh
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v

      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

          unexpected_changes="$(
            git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
              | grep -Ev '^(\.github/workflows/(android-release|beta-release)\.yml|scripts/release-metadata\.sh|scripts/generate-release-notes\.sh|scripts/generate_release_notes\.py|scripts/release_notes/.*|scripts/tests/.*)$' \
              || true
          )"
          if [[ -n "${unexpected_changes}" ]]; then
            echo "The version bump must be the final application change before release." >&2
            echo "Unexpected files changed after the bump:" >&2
            echo "${unexpected_changes}" >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" != "dry-run" ]]; then
            required_secrets=(
              LOCAL_PROPERTIES_BASE64
              RELEASE_KEYSTORE_BASE64
            )
            missing=()
            for secret_name in "${required_secrets[@]}"; do
              if [[ -z "${!secret_name}" ]]; then
                missing+=("${secret_name}")
              fi
            done
            if (( ${#missing[@]} > 0 )); then
              printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
              exit 1
            fi
          fi

      - name: Generate release notes
        env:
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          release_note_args=(
            --from "${PREVIOUS_BUMP}"
            --to "${CURRENT_BUMP}"
            --repository "${GITHUB_REPOSITORY}"
            --exclude "${EXCLUDE_COMMITS}"
            --quality-report release-note-quality.md
          )
          if [[ "${RELEASE_MODE}" == "publish" ]]; then
            release_note_args+=(--strict)
          fi

          generation_status=0
          ./scripts/generate-release-notes.sh "${release_note_args[@]}" \
            > release-notes.md || generation_status=$?

          if [[ ! -s release-notes.md ]]; then
            if [[ "${generation_status}" -ne 0 || "${RELEASE_MODE}" == "publish" ]]; then
              echo "No release-note commits were found." >&2
              exit 1
            fi
            printf '%s\n' 'Release notes pending. Replace this text before publishing.' > release-notes.md
          fi

          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            {
              printf '%s\n' \
                '> [!IMPORTANT]' \
                '> **Beta builds are for testing purposes and may contain bugs, regressions, or unexpected issues.** If you prefer a reliable experience, we recommend staying on the **Stable** channel.' \
                ''
              cat release-notes.md
            } > release-notes.tmp
            mv release-notes.tmp release-notes.md
          fi

          {
            echo "## ${{ steps.release.outputs.title }}"
            echo
            cat release-notes.md
            echo
            cat release-note-quality.md
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${generation_status}"

      - name: Upload release-note review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nuviotv-${{ steps.release.outputs.version }}-${{ inputs.mode }}-release-notes
          path: |
            release-notes.md
            release-note-quality.md
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Java
        if: inputs.mode != 'dry-run'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: inputs.mode != 'dry-run'
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release properties
        if: inputs.mode != 'dry-run'
        run: |
          keystore_path="${RUNNER_TEMP}/nuviotv-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

          if [[ -n "${LOCAL_DEV_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_DEV_PROPERTIES_BASE64}" | base64 --decode > local.dev.properties
          fi

          set_property() {
            local property_name="$1"
            local property_value="$2"
            [[ -n "${property_value}" ]] || return 0
            sed -i -E "/^[[:space:]]*${property_name}[[:space:]]*=/d" local.properties
            printf '\n%s=%s\n' "${property_name}" "${property_value}" >> local.properties
          }

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          set_property NUVIO_RELEASE_STORE_FILE "${keystore_path}"
          set_property NUVIO_RELEASE_KEY_ALIAS "${RELEASE_KEY_ALIAS}"
          set_property NUVIO_RELEASE_KEY_PASSWORD "${RELEASE_KEY_PASSWORD}"
          set_property NUVIO_RELEASE_STORE_PASSWORD "${RELEASE_STORE_PASSWORD}"

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^[[:space:]]*${property_name}[[:space:]]*=[[:space:]]*.+$" local.properties; then
              echo "Missing required property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Test updater and build full release APKs
        if: inputs.mode != 'dry-run'
        run: ./gradlew :app:testFullReleaseUnitTest --tests 'com.nuvio.tv.updater.*' :app:assembleFullRelease --stacktrace

      - name: Upload build artifacts
        if: inputs.mode != 'dry-run'
        uses: actions/upload-artifact@v6
        with:
          name: nuviotv-${{ steps.release.outputs.version }}-full-release
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Download and verify the matching Windows PC release
        if: inputs.mode != 'dry-run'
        env:
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
        run: |
          set -euo pipefail
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          desktop_release="$(gh release view "v${DESKTOP_VERSION}" --repo Pepeu2010/telumia-desktop --json isDraft,assets)"
          [[ "$(jq -r .isDraft <<<"$desktop_release")" == false ]]
          msi="$(jq -c '.assets[] | select(.name == "Telumia-Windows-x64.msi" and .state == "uploaded")' <<<"$desktop_release")"
          [[ -n "$msi" ]]
          url="$(jq -r .url <<<"$msi")"
          expected_size="$(jq -r .size <<<"$msi")"
          expected_digest="$(jq -r .digest <<<"$msi" | sed 's/^sha256://')"
          mkdir -p release-assets
          target="release-assets/Telumia-Windows-x64-${DESKTOP_VERSION}.msi"
          curl --fail --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 900 "$url" --output "$target"
          [[ "$(stat -c %s "$target")" == "$expected_size" ]]
          [[ "$(sha256sum "$target" | awk '{print $1}')" == "$expected_digest" ]]

      - name: Create GitHub release
        if: inputs.mode != 'dry-run'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_TARGET: ${{ steps.release.outputs.current_bump }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
        run: |
          set -euo pipefail
          mapfile -t release_apks < <(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#release_apks[@]} == 0 )); then
            echo "No release APKs were produced." >&2
            exit 1
          fi
          mkdir -p release-assets
          for apk in "${release_apks[@]}"; do cp "$apk" release-assets/; done
          [[ -s "release-assets/Telumia-Windows-x64-${DESKTOP_VERSION}.msi" ]]
          (cd release-assets && sha256sum ./*.apk ./*.msi > SHA256SUMS.txt)

          cat >> release-notes.md <<EOF

          ### Windows PC

          Esta release também inclui o instalador Windows x64 Telumia Desktop **${DESKTOP_VERSION}** (`Telumia-Windows-x64-${DESKTOP_VERSION}.msi`). APKs e MSI estão listados juntos; SHA256SUMS.txt contém os hashes dos pacotes.
          EOF

          release_args=(
            "${RELEASE_TAG}"
            --target "${RELEASE_TARGET}"
            --title "Telumia ${RELEASE_TITLE} — Android TV + Windows PC ${DESKTOP_VERSION}"
            --notes-file release-notes.md
          )
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          elif [[ "${RELEASE_MODE}" == "publish" ]]; then
            release_args+=(--latest)
          fi
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          mapfile -t release_assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          gh release create "${release_args[@]}" "${release_assets[@]}"

          published_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          grep -Eq '\.apk$' <<<"${published_assets}"
          grep -Fxq "Telumia-Windows-x64-${DESKTOP_VERSION}.msi" <<<"${published_assets}"
          grep -Fxq 'SHA256SUMS.txt' <<<"${published_assets}"
