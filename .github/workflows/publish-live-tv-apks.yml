name: Publish updated Live TV APKs to a release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful PR Full Debug Build workflow run ID
        required: true
        type: string
      release_tag:
        description: New prerelease tag matching the APK versionName (for example v1.0.1-alpha.1)
        required: true
        type: string
      desktop_version:
        description: Published Telumia Desktop MSI version to include in this release
        required: true
        default: "1.0.0"
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-live-tv-apks-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested Android TV APKs
    runs-on: ubuntu-latest
    steps:
      - name: Validate source run and release tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          [[ "$(jq -r '.conclusion' <<<"${run_json}")" == "success" ]]
          [[ "$(jq -r '.name' <<<"${run_json}")" == "PR Full Debug Build" ]]
          [[ "$(jq -r '.event' <<<"${run_json}")" == "workflow_dispatch" ]]

          source_sha="$(jq -r '.head_sha' <<<"${run_json}")"
          source_branch="$(jq -r '.head_branch' <<<"${run_json}")"
          [[ "${source_branch}" == codex/* ]]
          git init source-checkout
          git -C source-checkout remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C source-checkout fetch --depth=1 origin "${source_sha}"

          apk_version="$(git -C source-checkout show "${source_sha}:app/build.gradle.kts" \
            | sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' \
            | head -n 1)"
          [[ "${RELEASE_TAG#v}" == "${apk_version}" ]]
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          desktop_release="$(gh release view "v${DESKTOP_VERSION}" --repo Pepeu2010/telumia-desktop --json isDraft,assets)"
          [[ "$(jq -r .isDraft <<<"${desktop_release}")" == false ]]
          jq -e '.assets[] | select(.name == "Telumia-Windows-x64.msi" and .state == "uploaded")' \
            <<<"${desktop_release}" >/dev/null

          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${apk_version}" >> "${GITHUB_OUTPUT}"

      - name: Download APK artifacts without extracting their ZIP payloads
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-apks
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts")"
          download_apk() {
            local artifact_name="$1" target="$2" artifact_id
            artifact_id="$(jq -r --arg name "${artifact_name}" \
              '.artifacts[] | select(.name == $name and .expired == false) | .id' \
              <<<"${artifacts}" | head -n 1)"
            [[ -n "${artifact_id}" && "${artifact_id}" != null ]]
            curl --fail --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 --max-time 900 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "release-apks/${target}"
            unzip -t "release-apks/${target}"
            [[ "$(stat -c %s "release-apks/${target}")" -gt 500000 ]]
          }
          download_apk app-full-universal-debug.apk app-full-universal-debug.apk
          download_apk app-full-arm64-v8a-debug.apk app-full-arm64-v8a-debug.apk
          download_apk app-full-armeabi-v7a-debug.apk app-full-armeabi-v7a-debug.apk

      - name: Download and verify the selected Windows PC release
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
        run: |
          set -euo pipefail
          desktop_release="$(gh release view "v${DESKTOP_VERSION}" --repo Pepeu2010/telumia-desktop --json assets)"
          msi_asset="$(jq -c '.assets[] | select(.name == "Telumia-Windows-x64.msi" and .state == "uploaded")' <<<"${desktop_release}")"
          url="$(jq -r .url <<<"${msi_asset}")"
          expected_size="$(jq -r .size <<<"${msi_asset}")"
          expected_sha="$(jq -r .digest <<<"${msi_asset}" | sed 's/^sha256://')"
          curl --fail --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 900 "$url" --output "release-apks/Telumia-Windows-x64-${DESKTOP_VERSION}.msi"
          [[ "$(stat -c %s "release-apks/Telumia-Windows-x64-${DESKTOP_VERSION}.msi")" == "$expected_size" ]]
          [[ "$(sha256sum "release-apks/Telumia-Windows-x64-${DESKTOP_VERSION}.msi" | awk '{print $1}')" == "$expected_sha" ]]

      - name: Prepare APKs, checksums, and release notes
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t apk_files < <(find release-apks -type f -name '*.apk' -print | sort)
          if (( ${#apk_files[@]} != 3 )); then
            printf 'Expected exactly 3 APKs, found %s.\n' "${#apk_files[@]}" >&2
            find release-apks -maxdepth 3 -type f -print >&2
            exit 1
          fi

          for apk in "${apk_files[@]}"; do
            filename="$(basename "${apk}")"
            [[ "$(head -c 4 "${apk}" | od -An -tx1 | tr -d ' \n')" == 504b0304 ]]
            case "${filename}" in
              *universal*) target="Telumia-TV-${RELEASE_VERSION}-universal-debug.apk" ;;
              *arm64-v8a*) target="Telumia-TV-${RELEASE_VERSION}-arm64-v8a-debug.apk" ;;
              *armeabi-v7a*) target="Telumia-TV-${RELEASE_VERSION}-armeabi-v7a-debug.apk" ;;
              *) echo "Unexpected APK artifact: ${filename}" >&2; exit 1 ;;
            esac
            cp "${apk}" "release-assets/${target}"
          done

          desktop_msi="release-apks/Telumia-Windows-x64-${DESKTOP_VERSION}.msi"
          [[ -s "$desktop_msi" ]]
          cp "$desktop_msi" "release-assets/Telumia-Windows-x64-${DESKTOP_VERSION}.msi"

          [[ "$(find release-assets -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3 ]]
          (cd release-assets && sha256sum ./*.apk ./*.msi > SHA256SUMS.txt)
          cat > release-notes.md <<EOF
          ## Telumia TV ${RELEASE_VERSION}

          Esta versão centraliza a leitura dos modos de tela, capacidades HDR e perfis de decoder Dolby Vision, preservando a política de playback existente.

          Os três APKs passaram pelos testes focados do workflow [${SOURCE_SHA}](https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}).

          **Estes são APKs de depuração assinados pela chave de CI.** A assinatura pode diferir de uma instalação anterior; nesse caso, desinstale a versão anterior antes de instalar este pré-lançamento.

          Inclui o instalador Windows x64 Telumia Desktop **${DESKTOP_VERSION}** (`Telumia-Windows-x64-${DESKTOP_VERSION}.msi`). A versão de PC permanece explicitada separadamente quando não acompanha o número Android TV.

          Os hashes SHA-256 estão em SHA256SUMS.txt.
          EOF

      - name: Publish prerelease with APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "Telumia ${RELEASE_VERSION} — Android TV + Windows PC ${DESKTOP_VERSION}" \
            --notes-file release-notes.md \
            --draft \
            --prerelease \
            release-assets/*.apk release-assets/*.msi release-assets/SHA256SUMS.txt

          release_id="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId)"
          asset_count="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')"
          [[ "${asset_count}" -eq 5 ]]
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false >/dev/null

          release_state="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')"
          [[ "${release_state}" == $'false\ttrue' ]]
