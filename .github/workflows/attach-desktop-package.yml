name: Attach Desktop package to Android TV prerelease

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Android TV prerelease tag
        required: true
        type: string
      desktop_version:
        description: Published Telumia Desktop version whose MSI should be attached
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: attach-desktop-package-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  attach:
    name: Attach and verify the Windows MSI
    runs-on: ubuntu-latest
    steps:
      - name: Validate releases and download the published MSI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          tv_release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets)"
          [[ "$(jq -r .isDraft <<<"$tv_release")" == false ]]
          [[ "$(jq -r .isPrerelease <<<"$tv_release")" == true ]]
          desktop_tag="v${DESKTOP_VERSION}"
          desktop_release="$(gh release view "$desktop_tag" --repo Pepeu2010/telumia-desktop --json isDraft,isPrerelease,assets)"
          [[ "$(jq -r .isDraft <<<"$desktop_release")" == false ]]
          msi_asset="$(jq -c '.assets[] | select(.name == "Telumia-Windows-x64.msi" and .state == "uploaded")' <<<"$desktop_release")"
          [[ -n "$msi_asset" ]]

          mkdir -p release-assets
          target="Telumia-Windows-x64-${DESKTOP_VERSION}.msi"
          url="$(jq -r .url <<<"$msi_asset")"
          expected_digest="$(jq -r .digest <<<"$msi_asset" | sed 's/^sha256://')"
          expected_size="$(jq -r .size <<<"$msi_asset")"
          curl --fail --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 900 "$url" --output "release-assets/$target"
          [[ "$(stat -c %s "release-assets/$target")" == "$expected_size" ]]
          actual_digest="$(sha256sum "release-assets/$target" | awk '{print $1}')"
          [[ "$actual_digest" == "$expected_digest" ]]

          if jq -e --arg name "$target" '.assets[] | select(.name == $name)' <<<"$tv_release" >/dev/null; then
            echo "The Windows package is already attached: $target" >&2
            exit 1
          fi

          sums_url="$(jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .url' <<<"$tv_release")"
          [[ -n "$sums_url" && "$sums_url" != null ]]
          curl --fail --show-error --location --retry 5 "$sums_url" -o release-assets/SHA256SUMS.txt
          printf '%s  %s\n' "$actual_digest" "$target" >> release-assets/SHA256SUMS.txt

      - name: Upload the MSI and refreshed checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/*.msi release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Document the Desktop version on the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
        run: |
          set -euo pipefail
          marker='<!-- telumia-desktop-package -->'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md
          if ! grep -Fq "$marker" release-notes.md; then
            {
              cat release-notes.md
              printf '\n\n%s\n\n' "$marker"
              printf '%s\n\n' '### Windows PC'
              printf 'Inclui também o instalador Windows x64 da Telumia Desktop **%s**: `Telumia-Windows-x64-%s.msi`. O Desktop permanece nesta versão estável; os APKs Android TV desta pré-release são da versão indicada no título. O MSI foi copiado byte a byte da [release Desktop %s](https://github.com/Pepeu2010/telumia-desktop/releases/tag/v%s) e seu SHA-256 foi conferido antes do upload.\n\n' "$DESKTOP_VERSION" "$DESKTOP_VERSION" "$DESKTOP_VERSION" "$DESKTOP_VERSION"
              printf '%s\n' 'O manifesto SHA256SUMS.txt cobre os três APKs e o MSI.'
            } >> release-notes.md
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          fi

      - name: Verify the final release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets)"
          [[ "$(jq -r .isDraft <<<"$release")" == false ]]
          [[ "$(jq -r .isPrerelease <<<"$release")" == true ]]
          [[ "$(jq -r '.assets | length' <<<"$release")" -eq 5 ]]
          jq -e --arg name "Telumia-Windows-x64-${DESKTOP_VERSION}.msi" '.assets[] | select(.name == $name and .state == "uploaded")' <<<"$release" >/dev/null
          jq -e '.assets[] | select(.name == "SHA256SUMS.txt" and .state == "uploaded")' <<<"$release" >/dev/null
