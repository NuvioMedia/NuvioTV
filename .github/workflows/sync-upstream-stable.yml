name: Sync upstream stable

# Watches NuvioMedia/NuvioTV for non-beta stable releases and opens a PR into
# this fork's default branch (dev). Pre-releases and beta/rc/alpha tags are ignored.
#
# Note: scheduled workflows are disabled on forks until you visit the Actions tab
# once and enable them. workflow_dispatch always works when Actions are on.

on:
  schedule:
    - cron: "0 14 * * *" # daily 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

# Pushing a merge that touches `.github/workflows/*` requires a PAT with the
# `workflow` scope. Create one and store it as repo secret SYNC_UPSTREAM_TOKEN
# (Settings → Secrets and variables → Actions). The default GITHUB_TOKEN cannot
# create/update workflow files.

concurrency:
  group: sync-upstream-stable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: NuvioMedia/NuvioTV
      # gh defaults to the parent repo inside a fork, which would target upstream.
      # Every gh pr/issue call below pins --repo to this fork instead.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve latest upstream stable release
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Do not use `gh --paginate` with a jq expression that picks .[0]:
          # jq runs per page and prints one "latest" per page, which corrupts
          # GITHUB_OUTPUT when concatenated. One page of 100 is enough.
          RELEASE="$(
            gh api "repos/${UPSTREAM}/releases?per_page=100" --jq '
              [
                .[]
                | select(.draft == false and .prerelease == false)
                | select(
                    ((.tag_name // "") + " " + (.name // ""))
                    | test("(?i)(^|[^a-z])(beta|rc|alpha|preview)([^a-z]|$)")
                    | not
                  )
              ]
              | sort_by(.published_at)
              | reverse
              | .[0]
              | if . == null then empty else
                  {tag: .tag_name, name: .name, url: .html_url, published: .published_at}
                end
            '
          )"

          if [[ -z "${RELEASE}" ]]; then
            echo "No stable upstream release found."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="$(jq -r '.tag' <<<"$RELEASE")"
          NAME="$(jq -r '.name // .tag' <<<"$RELEASE")"
          URL="$(jq -r '.url' <<<"$RELEASE")"
          PUBLISHED="$(jq -r '.published' <<<"$RELEASE")"

          # Heredoc form is safe if name/url ever contain newlines or '='.
          {
            echo "tag=${TAG}"
            echo "name<<EOF"
            printf '%s\n' "${NAME}"
            echo "EOF"
            echo "url<<EOF"
            printf '%s\n' "${URL}"
            echo "EOF"
            echo "published=${PUBLISHED}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

          echo "Found stable release: ${TAG} (${NAME})"

      - name: Require SYNC_UPSTREAM_TOKEN
        if: steps.stable.outputs.skip != 'true'
        env:
          SYNC_UPSTREAM_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: |
          if [[ -z "${SYNC_UPSTREAM_TOKEN}" ]]; then
            echo "::error::Missing secret SYNC_UPSTREAM_TOKEN. Create a classic PAT with 'repo' + 'workflow' (or a fine-grained PAT with Contents + Workflows on this repo), then add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout fork
        if: steps.stable.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT needed so git push can update branches that include workflow file changes.
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN }}

      - name: Open sync PR (or issue on conflict)
        if: steps.stable.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          TAG: ${{ steps.stable.outputs.tag }}
          RELEASE_NAME: ${{ steps.stable.outputs.name }}
          RELEASE_URL: ${{ steps.stable.outputs.url }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Hard stop: this workflow must never target the upstream repository.
          if [[ "${GH_REPO}" == "${UPSTREAM}" ]]; then
            echo "::error::Refusing to run against upstream ${UPSTREAM}."
            exit 1
          fi

          MARKER="<!-- upstream-stable-sync:${TAG} -->"
          BRANCH="sync/upstream-stable-${TAG}"

          # Already have an open PR for this tag? Match on head branch, which is
          # exact, instead of a body search that depends on search indexing.
          EXISTING_PR="$(
            gh pr list --repo "$GH_REPO" --state open --head "$BRANCH" \
              --json url --jq '.[0].url // empty'
          )"
          if [[ -n "$EXISTING_PR" ]]; then
            echo "Open PR already exists for $TAG: $EXISTING_PR"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "refs/tags/${TAG}:refs/tags/upstream-stable-${TAG}"
          git fetch origin "$BASE_BRANCH"
          # Fetch any previous sync branch so --force-with-lease has a real lease.
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true

          # Skip if base already contains the release commit.
          TAG_SHA="$(git rev-list -n 1 "upstream-stable-${TAG}")"
          if git merge-base --is-ancestor "$TAG_SHA" "origin/${BASE_BRANCH}"; then
            echo "origin/${BASE_BRANCH} already contains ${TAG} ($TAG_SHA); nothing to sync."
            exit 0
          fi

          git checkout -B "$BRANCH" "origin/${BASE_BRANCH}"

          BEFORE_SHA="$(git rev-parse HEAD)"
          if git merge --no-ff "upstream-stable-${TAG}" -m "chore: sync upstream stable ${TAG}"; then
            AFTER_SHA="$(git rev-parse HEAD)"

            # "Already up to date" exits 0 with --no-ff but creates no commit.
            # GitHub then rejects PR create: "No commits between base and head".
            if [[ "$BEFORE_SHA" == "$AFTER_SHA" ]]; then
              echo "Merge of ${TAG} produced no new commit (already up to date with origin/${BASE_BRANCH}). Skipping PR."
              exit 0
            fi

            if git diff --quiet "origin/${BASE_BRANCH}...HEAD"; then
              echo "No file diff between origin/${BASE_BRANCH} and ${BRANCH} after merge. Skipping PR."
              exit 0
            fi

            git push -u origin "$BRANCH" --force-with-lease

            BODY="$(cat <<EOF
          ${MARKER}

          Automated sync of upstream **stable** release [\`${TAG}\`](${RELEASE_URL}) (${RELEASE_NAME}).

          - Upstream: \`${UPSTREAM}\`
          - Target repository: \`${GH_REPO}\`
          - Target branch: \`${BASE_BRANCH}\`
          - Pre-releases / beta tags are ignored by this workflow.

          Review the diff, resolve any remaining issues, then merge when ready.
          EOF
          )"

            # Dedent for nicer PR body
            BODY="$(sed 's/^          //' <<<"$BODY")"

            # The freshly pushed ref can take a moment to become visible to the API.
            for attempt in 1 2 3 4 5; do
              if gh pr create \
                --repo "$GH_REPO" \
                --base "$BASE_BRANCH" \
                --head "$BRANCH" \
                --title "Sync upstream stable ${TAG}" \
                --body "$BODY"
              then
                exit 0
              fi
              echo "pr create attempt ${attempt} failed; retrying in 10s"
              sleep 10
            done

            echo "::error::Could not create sync PR for ${TAG} in ${GH_REPO}."
            exit 1
          else
            git merge --abort || true

            BODY="$(cat <<EOF
          ${MARKER}

          Upstream published stable release [\`${TAG}\`](${RELEASE_URL}) (${RELEASE_NAME}), but merging it into \`${BASE_BRANCH}\` conflicted automatically.

          Manual sync:

          \`\`\`bash
          git fetch https://github.com/${UPSTREAM}.git tag ${TAG}
          git checkout ${BASE_BRANCH}
          git checkout -b sync/upstream-stable-${TAG}
          git merge ${TAG}
          # resolve conflicts, then:
          git push -u origin sync/upstream-stable-${TAG}
          gh pr create --repo ${GH_REPO} --base ${BASE_BRANCH} --head sync/upstream-stable-${TAG}
          \`\`\`
          EOF
          )"
            BODY="$(sed 's/^          //' <<<"$BODY")"

            EXISTING_ISSUE="$(
              gh issue list --repo "$GH_REPO" --state open \
                --search "Upstream stable ${TAG} needs manual sync in:title" \
                --json url --jq '.[0].url // empty'
            )"
            if [[ -n "$EXISTING_ISSUE" ]]; then
              echo "Open issue already exists for $TAG: $EXISTING_ISSUE"
              exit 0
            fi

            gh issue create \
              --repo "$GH_REPO" \
              --title "Upstream stable ${TAG} needs manual sync" \
              --body "$BODY"
          fi
