name: Build Android TV APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Stripping Brand Flavour Variants from Manifest
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i '/_arctic_blue/d' app/src/main/AndroidManifest.xml
            sed -i '/_emerald/d' app/src/main/AndroidManifest.xml
            sed -i '/_rose_gold/d' app/src/main/AndroidManifest.xml
            sed -i '/_copper/d' app/src/main/AndroidManifest.xml
            sed -i '/_graphite/d' app/src/main/AndroidManifest.xml
          fi

      - name: Disabling Enforced Production Keystore
        run: |
          if [ -f app/build.gradle.kts ]; then
            sed -i 's/signingConfigs.getByName("release")/signingConfigs.getByName("debug")/g' app/build.gradle.kts
            sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' app/build.gradle.kts
          fi

      - name: Build Debug Unsigned APK
        run: ./gradlew assembleDebug || ./gradlew :app:assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Rebranded-TV-APK
          path: "**/build/outputs/apk/**/*.apk"
