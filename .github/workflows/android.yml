name: Build Android APK

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. Manually streams and unpacks your code files as a flat structure, bypassing the checkout tool entirely
    - name: Fetch Clean Repository Files
      run: |
        git init .
        git remote add origin https://github.com{{ github.repository }}.git
        git fetch --depth 1 origin ${{ github.sha }}
        git checkout FETCH_HEAD

    # 2. Inject missing library module
    - name: Manually Inject Library Folder
      run: |
        git clone --depth 1 https://github.com libmpv-android

    # 3. Setup Compiler Environment
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. Compile the App
    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    # 5. Output Payload
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
