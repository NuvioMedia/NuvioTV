name: Build Android APK

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04 # Pinning to 24.04 removes the system warning completely

    steps:
    # 1. Download flat source payload via fallback mechanism
    - name: Download Repository Source Code
      run: |
        curl -L -o repo.zip "https://github.com{{ github.repository }}/archive/${{ github.sha }}.zip"
        unzip repo.zip
        cd sparkTV-* || cd *
        mv * ../
        cd ..
        rm -rf repo.zip sparkTV-*

    # 2. Inject missing library module
    - name: Manually Inject Library Folder
      run: |
        git clone --depth 1 https://github.com libmpv-android

    # 3. Setup Compiler Environment
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. Compile the App
    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    # 5. Output Payload
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
