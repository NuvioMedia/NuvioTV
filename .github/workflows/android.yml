name: Build Android TV APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease || ./gradlew :app:assembleRelease || ./gradlew :app:assembleFullRelease

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Rebranded-TV-APK
          path: "**/build/outputs/apk/**/*.apk"
