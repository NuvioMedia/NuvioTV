name: Build Android APK

on:
  push:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1. Bypasses your commit cache history blocks entirely by using the v2 engine layout
    - name: Checkout Code Base
      uses: actions/checkout@v2

    # 2. Inject missing library module
    - name: Manually Inject Library Folder
      run: |
        git clone --depth 1 https://github.com libmpv-android

    # 3. Setup Compiler Environment
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. Compile the App
    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    # 5. Output Payload
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
