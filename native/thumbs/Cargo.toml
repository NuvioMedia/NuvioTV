[package]
name = "aiostreams-thumbs"
description = "Seek-bar thumbnails decoded from single keyframes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
bench = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "thumbs-bench"
required-features = ["bench"]

[dependencies]
aiostreams-container.workspace = true
dolby_vision.workspace = true
jpeg-encoder.workspace = true
libloading.workspace = true
log.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
